<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi Việt - AI Viết Bài Pi</title>
<style>body{font-family:system-ui,sans-serif;background:#1a0b2e;color:#fff;margin:0;padding:20px;text-align:center}h1{color:#facc15}.card{background:#fff;color:#222;border-radius:16px;padding:16px;max-width:520px;margin:16px auto;text-align:left}button{background:#7c3aed;color:#fff;border:0;padding:12px 16px;border-radius:12px;width:100%;font-weight:700;margin-top:10px;cursor:pointer}input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:8px;box-sizing:border-box}pre{white-space:pre-wrap;background:#f3f4f6;padding:12px;border-radius:10px;min-height:120px}</style>
</head><body>
<h1>π Pi Việt</h1><p>AI Viết Bài Pi</p>
<div class="card"><h3>Đăng nhập bằng Pi</h3><p id="user">Chưa đăng nhập - mở bằng Pi Browser để đăng nhập</p><p id="status"></p></div>
<div class="card"><h3>AI Viết Bài Pi</h3><input id="topic" placeholder="Nhập chủ đề, vd: Tàu ngầm Pi"><select id="style"><option>TikTok</option><option>Facebook</option><option>CapCut</option></select><button id="btnWrite" type="button">Viết Bài Ngay</button><pre id="out">Nhập chủ đề rồi bấm Viết Bài Ngay</pre><button id="btnCopy" type="button">Copy Bài Viết</button></div>
<script>
function vietBaiNgay(){
  try{
    var t=document.getElementById('topic').value.trim() || 'Tàu ngầm Pi';
    var s=document.getElementById('style').value;
    var txt='['+s+'] '+t+'\n\nPi Network đang bước vào giai đoạn quan trọng. Kiên trì khai thác mỗi ngày, đừng bỏ cuộc.\n\n'+t+' - Pioneers cùng nhau giữ vững niềm tin, chờ ngày Pi bay cao!\n\n#PiNetwork #PiViet #piviet #PiCoin #Pi';
    document.getElementById('out').textContent=txt;
  }catch(e){ alert('Lỗi: '+e.message); }
}
function copyBaiViet(){
  try{
    var t=document.getElementById('out').textContent;
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ alert('Đã copy!'); }); }
    else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Đã copy!'); }
  }catch(e){ alert('Copy thất bại, bạn chọn tay nhé'); }
}
document.getElementById('btnWrite').addEventListener('click', vietBaiNgay);
document.getElementById('btnCopy').addEventListener('click', copyBaiViet);
</script></body></html>
